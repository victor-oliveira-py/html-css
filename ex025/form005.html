<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form005</title>
</head>
<body>
    <h1>Teste de Formulário05</h1>
    <form action="cadastro.py" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="Sexo" id="isxmas" value="Masculino"><label for="isxmas">Masculino</label><br>
            <input type="radio" name="Sexo" id="isxfem" value="Feminino"><label for="isxfem">Feminino</label>
        </fieldset>
        <fieldset>
            <legend>Esportes Favoritos</legend>
            <input type="checkbox" name="Esporte" id="iesfut" value="Futebol"> <label for="iesfut">Futebol</label><br>
            <input type="checkbox" name="Esporte" id="iesbas" value="Basquete"><label for="iesbas">Basquete</label><br>
            <input type="checkbox" name="Esporte" id="iesnat" value="Natação"><label for="iesnat">Natação</label><br>
            <input type="checkbox" name="Esporte" id="iesten" value="Tenis"><label for="iesten">Tenis</label><br>
            <input type="checkbox" name="Esporte" id="iesjudo" checked value="Judô"><label for="iesjudo">Judô</label>
        </fieldset>


        <P>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
