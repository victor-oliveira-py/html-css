<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    <style>
        div.container {
            display: grid;
            grid-template: repeat(4, 1fr)/ repeat(3,100px)
        }

        .item {
            border: 3px solid red;
            padding: 10px;
        }
        
        .caixa1 {
            grid-row-start: 1;
            grid-row-end: 2;
            grid-column-start: 1;
            grid-column-end: 5;
        }

        .caixa2 {
            grid-row-start: 2;
            grid-row-end: 4;
            grid-column-start: 1;
            grid-column-end: 3;
        }

        .caixa3 {
            grid-row-start: 2;
            grid-row-end: 4;
            grid-column-start: 3;
            grid-column-end: 5;

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item caixa1">A</div>
        <div class="item caixa2">B</div>
        <div class="item caixa3">C</div>
    </div>
</body>
</html>
