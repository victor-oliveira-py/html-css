<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticas Grid Layout</title>
    <style>
        /* Simplificação usando o gri-row/grid-column e o span */
        .container {
            display: grid;

            grid-template: repeat(3,100px)/ repeat(4,1fr);
            border: 3px solid red;
            gap: 10px;
            justify-content: center;
        }

        .item {
            border: 3px solid blue;
        }

        .caixa1 {
            background-color: rgba(255, 0, 0, 0.24);
            grid-row: 1/span 1;
            grid-column: 1/span 5;
        }

        .caixa2 {
            background-color: rgba(0, 128, 0, 0.144);
            grid-row: 2/ span 2;
            grid-column: 1/ span 2;
        }

        .caixa3 {
            background-color: rgba(0, 0, 255, 0.205);
            grid-row: 2/ span 2;
            grid-column: 3/ span 2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item caixa1">Caixa 01</div>
        <div class="item caixa2">Caixa 02</div>
        <div class="item caixa3">Caixa 03</div>
    </div>
    
</body>
</html>
